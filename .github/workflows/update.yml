name: Update rankings

on:
  schedule:
    # 03:17 UTC = 11:17 Taiwan / 12:17 Japan, after DAM's 11:00 JST daily update.
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scraper/**"
      - "tests/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-rankings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Start from the latest commit on the branch, not the one that queued this run:
      # an earlier run may have pushed new data while this one was waiting.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -t .

      - name: Fetch rankings
        run: python -m scraper

      # iTunes allows about 20 requests a minute, so new songs are looked up in batches.
      # A failure here only means fewer tags today; the rankings still publish.
      - name: Look up genres and listen links
        continue-on-error: true
        run: python -m scraper.enrich --max 300 --budget 1500

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data data
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Update rankings $(TZ=Asia/Taipei date +%F)"
          # This commit only touches generated data, so on a conflict keep this run's
          # newer version (-X theirs is "the commit being replayed" during a rebase).
          for attempt in 1 2 3; do
            if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push attempt ${attempt} failed; retrying."
            sleep 5
          done
          exit 1

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
